services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: therapea-backend
    restart: always
    ports:
      - "8083:8083"
    env_file:
      - ./backend/.env
    networks:
      - therapea-net

  frontend:
    build:
      context: ./web/therapea-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_AGORA_APP_ID: ${VITE_AGORA_APP_ID}
        VITE_PAYMONGO_PUBLIC_KEY: ${VITE_PAYMONGO_PUBLIC_KEY}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: therapea-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - therapea-net

networks:
  therapea-net:
    driver: bridge